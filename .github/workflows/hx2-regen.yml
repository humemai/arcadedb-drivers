name: hx2 regenerate (temporary)

# Fork-only helper for the httpx2 spike: runs the repository's own generator on a runner and
# hands the result back as a patch. Removed from the branch once the patch is committed.
on:
  push:
    branches:
      - "spike/207-httpx2"
    paths:
      - ".github/workflows/hx2-regen.yml"

permissions:
  contents: read

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - name: Regenerate the HTTP client
        working-directory: python
        run: |
          uv sync --frozen --python 3.11
          ./scripts/generate.sh
          git add -N packages/driver/src/arcadedb_driver/_generated
          git diff --binary -- packages/driver/src/arcadedb_driver/_generated > "$RUNNER_TEMP/regen.patch"
          git diff --stat -- packages/driver/src/arcadedb_driver/_generated | tail -n 5
          echo "generated files importing httpx / httpx2:"
          git grep -lE '^\s*(import|from) httpx\b' -- packages/driver/src/arcadedb_driver/_generated | wc -l
          git grep -lE '^\s*(import|from) httpx2\b' -- packages/driver/src/arcadedb_driver/_generated | wc -l
      - name: Skip allowlist
        working-directory: python
        run: uv run python scripts/check_codegen_skips.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regen-patch
          path: ${{ runner.temp }}/regen.patch
