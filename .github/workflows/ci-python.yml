name: Python driver CI

on:
  push:
    branches:
      - main
    paths:
      - "python/**"
      - "contracts/**"
      - "scripts/**"
      # The drift gate's untracked-file half is a `git status --porcelain` over the
      # generated directory, which an ignore rule covering it would silence
      # permanently and invisibly. ci.yml lists .gitignore for the same reason.
      - ".gitignore"
      - ".github/workflows/ci-python.yml"
  pull_request:
    paths:
      - "python/**"
      - "contracts/**"
      - "scripts/**"
      - ".gitignore"
      - ".github/workflows/ci-python.yml"

jobs:
  build:
    name: Lint, typecheck and drift gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Set up Python
        working-directory: python
        # 3.11 is arcadedb-driver's declared floor (httpx2 needs it). The e2e job below
        # runs 3.14, so the two jobs together cover floor and current without a matrix,
        # and grpc-floor covers arcadedb-driver-grpc's lower floor.
        run: uv python install 3.11

      - name: Install dependencies
        working-directory: python
        run: uv sync --frozen --python 3.11

      - name: Lint
        working-directory: python
        # The two ../scripts paths are named explicitly because `ruff check .` from
        # python/ reaches only python/scripts/. The license checker and its tests live at
        # the repository root, outside this working directory, so without them ruff would
        # never see the files mypy already type-checks (they are on mypy's `files` list in
        # pyproject.toml). Confirm any change here with `ruff check <args> --show-files`,
        # which prints exactly what ruff will lint.
        run: |
          uv run ruff check . ../scripts/check-licenses.py ../scripts/tests/test_check_licenses.py
          uv run ruff format --check . ../scripts/check-licenses.py ../scripts/tests/test_check_licenses.py

      - name: Typecheck
        working-directory: python
        run: uv run mypy

      - name: Regenerate and verify no drift
        working-directory: python
        run: |
          ./scripts/generate.sh

          # Catches a MODIFIED generated file (existing path, changed content).
          git diff --exit-code -- packages/driver/src/arcadedb_driver/_generated

          # Catches an ADDED or RENAMED generated file: `git diff` above is blind to
          # untracked paths, so a contract that introduces a new model or operation
          # module would leave the diff check green while the new file went uncommitted.
          if [[ -n "$(git status --porcelain -- packages/driver/src/arcadedb_driver/_generated)" ]]; then
            echo "Generated output changed (untracked and/or modified files below) - commit the regenerated output:" >&2
            git status --porcelain -- packages/driver/src/arcadedb_driver/_generated >&2
            exit 1
          fi

      - name: Verify the generator skipped exactly the allowlisted endpoints
        working-directory: python
        # The third half of the drift gate, and the one with no TypeScript
        # counterpart: openapi-python-client drops an endpoint it cannot model,
        # warns, and exits 0. Neither check above can see an endpoint that was
        # never generated in the first place.
        run: uv run python scripts/check_codegen_skips.py

      # Two-part, not three. The HTTP gate's third part exists because
      # openapi-python-client drops an endpoint it cannot model, warns, and exits 0, so
      # neither check above can see an endpoint that was never generated. protoc has no
      # such failure mode - it fails loudly - so a third check here would imply a risk
      # that does not exist.
      - name: Regenerate the gRPC client and verify no drift
        working-directory: python
        run: |
          ./scripts/generate-grpc.sh

          GEN=packages/driver-grpc/src/arcadedb_driver_grpc/_generated

          # Catches a MODIFIED generated file (existing path, changed content).
          git diff --exit-code -- "$GEN"

          # Catches an ADDED or RENAMED generated file: `git diff` above is blind to
          # untracked paths, so a contract that introduced a new message would leave the
          # diff check green while the new file went uncommitted.
          if [[ -n "$(git status --porcelain -- "$GEN")" ]]; then
            echo "Generated gRPC output changed - commit the regenerated output:" >&2
            git status --porcelain -- "$GEN" >&2
            exit 1
          fi

      - name: Test
        working-directory: python
        run: uv run pytest

      # httpx is still installed in the dev environment (respx and the generator use it), so
      # a stray `import httpx` in the driver would pass every check above. Install the built
      # wheel alone and require that httpx is neither present nor imported.
      - name: Verify the built driver needs no httpx
        working-directory: python
        run: |
          uv build --package arcadedb-driver --out-dir "$RUNNER_TEMP/dist-driver"
          cd "$RUNNER_TEMP"
          uv run --no-project --python 3.11 --with "$RUNNER_TEMP"/dist-driver/*.whl python - <<'PY'
          import importlib.util
          import sys

          import arcadedb_driver
          import arcadedb_driver.aio
          import arcadedb_driver.facade.insert_session

          assert importlib.util.find_spec("httpx") is None, "httpx is installed with the driver"
          assert "httpx" not in sys.modules and "httpcore" not in sys.modules
          assert "httpx2" in sys.modules
          with arcadedb_driver.ArcadeDBServer(base_url="http://127.0.0.1:9") as server:
              print(type(server.raw.get_httpx_client()))
          PY

  grpc-floor:
    name: gRPC driver on its Python 3.10 floor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      # The workspace resolves for 3.11, so the gRPC package, which still declares 3.10,
      # is tested here from its wheel, outside the workspace.
      - name: Test the gRPC wheel on Python 3.10
        working-directory: python
        run: |
          uv build --package arcadedb-driver-grpc --out-dir dist-grpc
          uv run --no-project --python 3.10 --with dist-grpc/*.whl --with pytest --with pytest-asyncio \
            --with packaging pytest packages/driver-grpc/tests

  e2e:
    name: End-to-end against a real server
    needs: build
    runs-on: ubuntu-latest
    # Container pull plus ArcadeDB JVM startup can run well past what the unit job
    # needs; an explicit cap keeps a hung container from burning the runner's
    # default multi-hour budget instead of failing fast.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Set up Python
        working-directory: python
        # 3.14, not the build job's 3.10: the two jobs together cover the declared
        # floor and the current release without a matrix.
        run: uv python install 3.14

      - name: Install dependencies
        working-directory: python
        run: uv sync --frozen --python 3.14

      - name: E2E tests against a real ArcadeDB server
        working-directory: python
        run: uv run pytest e2e -v
